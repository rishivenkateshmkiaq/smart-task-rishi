services:
  auth-service:
    image: 746430304915.dkr.ecr.ap-south-1.amazonaws.com/smart-task-auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGO_URI: ${AUTH_MONGO_URI:?AUTH_MONGO_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 1d
    networks:
      - smart-network

  task-service:
    image: 746430304915.dkr.ecr.ap-south-1.amazonaws.com/smart-task-task-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5002
      MONGO_URI: ${TASK_MONGO_URI:?TASK_MONGO_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: 1d
    networks:
      - smart-network

  notification-service:
    image: 746430304915.dkr.ecr.ap-south-1.amazonaws.com/smart-task-notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5003
      MONGO_URI: ${NOTIFICATION_MONGO_URI:?NOTIFICATION_MONGO_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - smart-network

  report-service:
    image: 746430304915.dkr.ecr.ap-south-1.amazonaws.com/smart-task-report-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 5004
      MONGO_URI: ${REPORT_MONGO_URI:?REPORT_MONGO_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    networks:
      - smart-network

  api-gateway:
    image: 746430304915.dkr.ecr.ap-south-1.amazonaws.com/smart-task-api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      TASK_SERVICE_URL: http://task-service:5002
      NOTIFICATION_SERVICE_URL: http://notification-service:5003
      REPORT_SERVICE_URL: http://report-service:5004
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - report-service
    networks:
      - smart-network

  frontend:
    image: 746430304915.dkr.ecr.ap-south-1.amazonaws.com/smart-task-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api-gateway
    networks:
      - smart-network

networks:
  smart-network:
    driver: bridge
