
services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service_1784011000189
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
    - PORT=5001
    - MONGO_URI=mongodb://mongodb:27017/authdb
    - JWT_SECRET=MySecret@123
    - JWT_EXPIRES_IN=1d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  task-service:
    build: ./task-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
    - PORT=5002
    - MONGO_URI=mongodb://mongodb:27017/taskdb
    - JWT_SECRET=MySecret@123
    - JWT_EXPIRES_IN=1d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongodb:27017/notificationdb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  report-service:
    build: ./report-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      MONGO_URI: mongodb://mongodb:27017/reportdb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smart-network

  api-gateway:
    build: ./api-gateway_1784010924579
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      TASK_SERVICE_URL: http://task-service:5002
      NOTIFICATION_SERVICE_URL: http://notification-service:5003
      REPORT_SERVICE_URL: http://report-service:5004
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - task-service
      - notification-service
      - report-service
    networks:
      - smart-network

volumes:
  mongo_data:

networks:
  smart-network:
    driver: bridge

